name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ko:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # tools/build_ko.sh 需要 nightly + rust-src(build-std) + thumbv8m 目标。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: thumbv8m.main-none-eabi

      - name: Set build time
        run: echo "CHAOS_BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"

      - name: Test honeycomb geometry and controller
        run: python3 tools/test_honeycomb.py

      - name: Test application icon picker, saved selection and animation
        run: python3 tools/test_dynamic_icon.py

      - name: Test capture worker and decode GIF/APNG/BMP
        run: |
          python3 -m venv .capture-test-venv
          .capture-test-venv/bin/pip install -r tools/requirements-test.txt
          .capture-test-venv/bin/python tools/test_capture.py

      - name: Check supplied GIF and original playback timing
        run: .capture-test-venv/bin/python tools/test_gif_icon.py

      - name: Check original 96px installer icons
        run: .capture-test-venv/bin/python tools/test_static_icon.py

      - name: Test legacy and animated CIPK deliveries and streamed player
        run: .capture-test-venv/bin/python tools/test_icon_pack.py

      - name: Test Corona background integration
        run: CC=cc python3 tools/test_corona_blur.py

      - name: Build supervisor
        run: sh tools/build_ko.sh

      - name: Upload chaos_sup.ko
        uses: actions/upload-artifact@v4
        with:
          name: chaos_sup.ko
          path: supervisor/chaos_sup.ko
          if-no-files-found: error

      # 完整安装包: fetch/capatch (clang C) + 应用图标 (Pillow) + p67 容器。
      # build.py 会自动: 安装器 lua 瘦身 (token 校验) + 容器内 ko 副本 strip。
      - name: Build installer container
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq llvm > /dev/null
          python3 -m pip install --quiet pillow
          python3 tools/build.py --skip-ko

      - name: Upload installer container
        uses: actions/upload-artifact@v4
        with:
          name: chaos-installer-p67
          path: dist/chaos-installer-p67.bin
          if-no-files-found: error
