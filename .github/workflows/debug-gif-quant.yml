name: debug-gif-quant
on:
  push:
    branches: [debug/gifquant]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe quantizer stability
        run: |
          set -e
          for v in 12.2.0 12.3.0; do
            python -m venv "venv-$v"
            "./venv-$v/bin/pip" install -q "Pillow==$v"
            echo "=== Pillow $v ==="
            cd tools
            "../venv-$v/bin/python" _probe_quant.py
            cd ..
          done
