<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaos 马达音乐同步器</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 18px; background: #14161a; color: #e6e8ec;
         font: 15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.hint { margin: 0 0 16px; color: #9aa1ab; font-size: 13px; }
  .card { background: #1c1f25; border: 1px solid #2a2e36; border-radius: 12px;
          padding: 14px; margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: #9aa1ab; margin-bottom: 6px; }
  input[type=file] { width: 100%; font-size: 14px; }
  input[type=range] { width: 100%; }
  select, button { font: inherit; }
  select { width: 100%; background: #14161a; color: #e6e8ec; border: 1px solid #2a2e36;
           border-radius: 8px; padding: 9px; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 10px; font-weight: 600;
           background: #3b82f6; color: #fff; }
  button:disabled { background: #2a2e36; color: #6b7280; }
  button.alt { background: #22c55e; }
  #stat { font-size: 13px; color: #9aa1ab; white-space: pre-line; min-height: 40px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .ok { color: #22c55e; } .bad { color: #ef4444; }
</style>
</head>
<body>
<h1>马达音乐同步器</h1>
<p class="hint">选一首歌，浏览器本地分析出节奏脉冲，只把几百字节的序列传到手环（音频不出手机）。上传后在手表「马达音乐」页打开文件槽播放。</p>

<div class="card">
  <label>音频文件（mp3 / m4a / wav，建议 1 分钟以内）</label>
  <input id="file" type="file" accept="audio/*">
</div>

<div class="card">
  <label>灵敏度 <span id="sensv">1.0</span>（越大越容易触发）</label>
  <input id="sens" type="range" min="5" max="30" value="10">
  <label style="margin-top:12px">事件上限</label>
  <select id="limit">
    <option value="256">256（约 30 秒密集节奏）</option>
    <option value="512" selected>512（推荐）</option>
    <option value="1024">1024（更完整）</option>
    <option value="2048">2048（最长）</option>
  </select>
</div>

<div class="card">
  <button id="go" disabled>分析并生成</button>
  <div id="stat" style="margin-top:10px">等待选择文件…</div>
</div>

<div class="card">
  <label>保存到手环文件槽</label>
  <select id="slot">
    <option value="1">文件 1</option><option value="2">文件 2</option>
    <option value="3">文件 3</option><option value="4">文件 4</option>
    <option value="5">文件 5</option><option value="6">文件 6</option>
  </select>
  <div style="height:10px"></div>
  <button id="up" class="alt" disabled>上传到手环</button>
  <div id="upstat" style="margin-top:8px;font-size:13px"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let seq = null;   // Uint8Array(.buzz) 或 null

$('sens').addEventListener('input', () => {
  $('sensv').textContent = ($('sens').value / 10).toFixed(1);
});
$('file').addEventListener('change', () => {
  seq = null;
  $('go').disabled = !$('file').files.length;
  $('up').disabled = true;
  $('stat').textContent = '文件已选，点「分析并生成」。';
});

// 10ms 一跳的能量包络 → 正差分(onset strength) → 自适应阈值挑事件。
async function analyze(file, sensitivity, limit) {
  const raw = await file.arrayBuffer();
  const ctx = new OfflineAudioContext(1, 1, 44100);
  const audio = await ctx.decodeAudioData(raw);
  const sr = audio.sampleRate;
  const ch = audio.getChannelData(0);
  const n = ch.length;
  const hop = Math.max(1, Math.round(sr * 0.01));
  const win = hop * 2;

  const env = [];
  for (let i = 0; i + win <= n; i += hop) {
    let s = 0;
    for (let j = 0; j < win; j++) { const v = ch[i + j]; s += v * v; }
    env.push(Math.sqrt(s / win));
  }

  const flux = new Float32Array(env.length);
  for (let i = 1; i < env.length; i++) {
    const d = env[i] - env[i - 1];
    flux[i] = d > 0 ? d : 0;
  }
  let peak = 0;
  for (let i = 0; i < flux.length; i++) if (flux[i] > peak) peak = flux[i];
  if (!(peak > 0)) return { events: [], duration: n / sr };

  const K = 1.8 / sensitivity;   // 局部阈值系数
  const W = 8;                   // ±80ms 局部窗
  const events = [];
  let last = 0;
  for (let i = 1; i < flux.length && events.length < limit; i++) {
    let local = 0, cnt = 0;
    for (let j = Math.max(0, i - W); j < Math.min(flux.length, i + W); j++) { local += flux[j]; cnt++; }
    local /= cnt || 1;
    const th = local * K + peak * 0.015;
    if (flux[i] < th || flux[i] < peak * 0.05) continue;
    const delta = i - last;
    if (delta < 2) continue;     // 20ms 内不重复触发
    // 能量分三档映射到不同振动效果（重拍/中/轻）。
    const e = flux[i] / peak;
    const ty = e > 0.55 ? 0x0D : e > 0.25 ? 0x07 : 0x03;
    events.push([Math.min(Math.max(delta, 1), 255), ty]);
    last = i;
  }
  return { events, duration: n / sr };
}

function buildBinary(events) {
  if (!events.length) return null;
  const n = events.length;
  const out = new Uint8Array(8 + n * 3);
  out[0] = 0x42; out[1] = 0x5A; out[2] = 0x30; out[3] = 0x31;   // "BZ01"
  out[4] = n & 0xFF; out[5] = (n >> 8) & 0xFF;
  out[6] = 120; out[7] = 0;                                     // bpm 仅展示
  let o = 8;
  for (const [delta, ty] of events) {
    out[o++] = delta; out[o++] = ty; out[o++] = 0;
  }
  return out;
}

$('go').addEventListener('click', async () => {
  const f = $('file').files[0];
  if (!f) return;
  $('go').disabled = true;
  $('stat').textContent = '分析中…';
  try {
    const sensitivity = $('sens').value / 10;
    const limit = Number($('limit').value);
    const r = await analyze(f, sensitivity, limit);
    seq = buildBinary(r.events);
    const dur = r.duration.toFixed(1);
    if (!seq) {
      $('stat').innerHTML = '<span class="bad">没提取到节奏</span>：这首歌可能是持续音/安静段落，试试调高灵敏度。';
    } else {
      const bytes = seq.length;
      const span = (r.events.reduce((a, [d]) => a + d, 0) / 100).toFixed(1);
      $('stat').innerHTML = `<span class="ok">已生成</span>：${r.events.length} 个脉冲，序列 ${bytes} 字节，覆盖 ${span} 秒（音频 ${dur} 秒）`;
      $('up').disabled = false;
    }
  } catch (err) {
    $('stat').innerHTML = '<span class="bad">解码失败</span>：' + (err && err.message ? err.message : err);
  } finally {
    $('go').disabled = false;
  }
});

$('up').addEventListener('click', async () => {
  if (!seq) return;
  const slot = $('slot').value;
  $('up').disabled = true;
  $('upstat').textContent = '上传中…';
  try {
    const r = await fetch('/api/buzz/save?slot=' + slot, {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: seq
    });
    if (r.ok) {
      $('upstat').innerHTML = `<span class="ok">已保存到文件 ${slot}</span>，去手表「马达音乐」页点它播放。`;
    } else {
      $('upstat').innerHTML = `<span class="bad">失败 HTTP ${r.status}</span>`+
        '（先确认手环网页服务器的网页密码已设置，并且蓝牙网络共享在线）';
    }
  } catch (err) {
    $('upstat').innerHTML = '<span class="bad">网络错误</span>：' + (err && err.message ? err.message : err);
  } finally {
    $('up').disabled = false;
  }
});
</script>
</body>
</html>
